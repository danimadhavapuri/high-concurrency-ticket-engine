config:
  target: "http://localhost:5000"
  phases:
    - name: "Phase 1: Warm Up"
      duration: 10
      arrivalRate: 10
    - name: "Phase 2: Ramp Up Traffic"
      duration: 20
      arrivalRate: 20
      rampTo: 100
    - name: "Phase 3: Flash-Sale Concurrency Burst"
      duration: 15
      arrivalRate: 200
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "Browse Movie Catalog & Live Shows"
    flow:
      - get:
          url: "/api/movies"
      - get:
          url: "/api/seats/holds"

  - name: "Flash-Sale Concurrent Seat Lock Race"
    flow:
      - post:
          url: "/api/bookings/lock"
          json:
            showtimeId: 101
            seatIds: [12]
            userId: 999
