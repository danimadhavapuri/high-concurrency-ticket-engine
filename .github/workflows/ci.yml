name: High-Concurrency Engine CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Backend CI (TypeScript + Concurrency Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ticket-backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ticket-backend
        run: npm ci --legacy-peer-deps

      - name: Run Prisma Generate
        working-directory: ticket-backend
        run: npx prisma generate

      - name: Run Vitest Concurrency Test Suite
        working-directory: ticket-backend
        run: npm test

      - name: Run TypeScript Production Build
        working-directory: ticket-backend
        run: npm run build

  frontend-build:
    name: Frontend CI (Vite + React 19 Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ticket-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ticket-frontend
        run: npm ci

      - name: Run Vite Build Check
        working-directory: ticket-frontend
        run: npm run build
